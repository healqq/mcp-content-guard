linters:
  enable:
    - errcheck
    - gosec
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  gosec:
    excludes:
      # G104: errors unhandled — covered by errcheck with finer control.
      - G104
      # G304: file inclusion via variable — stats paths are derived from a
      # SHA-256 hash of the config key, not user input.
      - G304

issues:
  max-same-issues: 0
