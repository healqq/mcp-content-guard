version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: mcp-context-guard
    goos:   [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^bench:"
      - "^docs:"
      - "^ci:"
      - Merge pull request
      - Merge branch
